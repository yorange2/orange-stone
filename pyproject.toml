[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "orange-stone"
description = "Hearthstone simulator for RL training (Rust core, Python bindings)"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Games/Entertainment :: Simulation",
]

[tool.maturin]
features = ["py"]
module-name = "orange_stone"
