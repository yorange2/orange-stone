[package]
name = "orange-stone"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[features]
# Python 绑定（PyO3，stable ABI — 编译无需本机 Python 头文件）
py = ["dep:pyo3"]

[dependencies]
bincode = "1.3"
rayon = "1.10"
serde = { version = "1", features = ["derive", "rc"] }
pyo3 = { version = "0.25", features = ["abi3-py38"], optional = true }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = "0.5"
serde_json = "1"

[[bench]]
name = "event_queue"
harness = false

[[bench]]
name = "effect_resolution"
harness = false
